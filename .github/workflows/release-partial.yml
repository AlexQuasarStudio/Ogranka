name: Release partial

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Read version and build
        id: version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'app'); import config; print(config.APP_VERSION)")
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Unit and E2E tests
        run: python -m unittest discover -s app/tests -t app

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      OGRANKA_BUILD: ${{ needs.verify.outputs.build }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Build exe
        shell: cmd
        run: app\build_windows.bat
      - name: Package exe
        shell: pwsh
        run: |
          Copy-Item app\dist\Ogranka.exe "Ogranka-windows-$env:VERSION.exe"
          python app/build_delta.py "Ogranka-windows-$env:VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Ogranka-windows-*.exe
            Ogranka-windows-*.exe.delta.json
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      OGRANKA_BUILD: ${{ needs.verify.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r app/requirements-build.txt
      - name: Install AppImage tools
        run: sudo apt-get update && sudo apt-get install -y zsync
      - name: Build Linux archive
        run: bash app/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Ogranka-linux-*.AppImage
            Ogranka-linux-*.AppImage.zsync
            Ogranka-linux-*.delta.json
          if-no-files-found: error

  linux-arm64:
    needs: verify
    runs-on: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      OGRANKA_BUILD: ${{ needs.verify.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r app/requirements-build.txt
      - name: Install AppImage tools
        run: sudo apt-get update && sudo apt-get install -y zsync
      - name: Build Linux ARM64 archive
        run: bash app/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            Ogranka-linux-*-arm64.AppImage
            Ogranka-linux-*-arm64.AppImage.zsync
            Ogranka-linux-*.AppImage.delta.json
          if-no-files-found: error

  publish:
    needs: [verify, windows, linux, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Add build metadata
        run: |
          echo "" >> release-notes/${{ needs.verify.outputs.version }}.md
          echo "<!-- сборка: ${{ needs.verify.outputs.build }} -->" >> release-notes/${{ needs.verify.outputs.version }}.md
      - name: Create checksums
        run: |
          cd assets
          sha256sum Ogranka-windows-*.exe Ogranka-linux-*.AppImage Ogranka-linux-*.AppImage.zsync Ogranka-*.delta.json > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: Огранка ${{ needs.verify.outputs.version }} · сборка ${{ needs.verify.outputs.build }}
          body_path: release-notes/${{ needs.verify.outputs.version }}.md
          files: |
            assets/Ogranka-windows-*.exe
            assets/Ogranka-linux-*.AppImage
            assets/Ogranka-linux-*.AppImage.zsync
            assets/Ogranka-*.delta.json
            assets/SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
