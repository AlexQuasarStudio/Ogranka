name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Verify tag and read version
        id: version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'app'); import config; print(config.APP_VERSION)")
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app/config.py v${VERSION}" >&2
            exit 1
          fi
      - name: Unit and E2E tests
        run: python -m unittest discover -s app/tests -t app

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      OGRANKA_BUILD: ${{ needs.verify.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt pyinstaller
      - name: Build and sign app
        run: |
          cd app
          python -m PyInstaller --noconfirm --clean --distpath dist_new --workpath build --log-level WARN Ogranka.spec
          ditto --norsrc --noextattr dist_new/Ogranka.app "Огранка.app"
          xattr -cr "Огранка.app"
          codesign --force --deep --sign - "Огранка.app"
          codesign --verify --deep --strict "Огранка.app"
          ditto -c -k --keepParent --norsrc --noextattr "Огранка.app" "../Ogranka-macos-${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Ogranka-macos-*.zip
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      OGRANKA_BUILD: ${{ needs.verify.outputs.build }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Build exe
        shell: cmd
        run: app\build_windows.bat
      - name: Package exe
        shell: pwsh
        run: Copy-Item app\dist\Ogranka.exe "Ogranka-windows-$env:VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Ogranka-windows-*.exe
          if-no-files-found: error

  publish:
    needs: [verify, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd assets
          sha256sum Ogranka-macos-*.zip Ogranka-windows-*.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: Огранка ${{ needs.verify.outputs.version }} · build ${{ needs.verify.outputs.build }}
          body_path: release-notes/${{ needs.verify.outputs.version }}.md
          files: |
            assets/Ogranka-macos-*.zip
            assets/Ogranka-windows-*.exe
            assets/SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
